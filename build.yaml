changelog: |-
  Fixes several bugs that made scrobbling stop silently until Jellyfin was restarted.

  ### Fixed ###
  - Fix sessions permanently wedging in the "already scrobbling" state, which silently
    stopped all further scrobbling for that client. Session state now advances only after
    Simkl has actually accepted a call, and resets when the item changes or a playback ends
    without a stop event.
  - Fix rate-limited scrobbles being treated as sent, which skipped scrobbling for a whole
    playback (most often when starting the next episode straight after the previous one). A
    rate-limited state change is now deferred and retried on the next playback event instead
    of being dropped, and the final stop call waits for the limit rather than skipping.
  - Honour HTTP 429 and its Retry-After header: all calls for that account are held for the
    requested cooldown instead of being retried immediately. Rate limiting is now enforced
    both per session and per user, and a call consumes its slot even if it throws, so a
    failing Simkl is no longer hammered on every progress event.
  - Fix expired or revoked Simkl tokens failing silently and forever: HTTP error responses
    were never inspected, so the token was never cleared and the user was still shown as
    signed in.
  - Fix API failures being logged at Trace level, leaving no trace of the problem in a
    default Jellyfin setup. HTTP status, response body and error code are now logged at
    Warning.
  - Fix episodes being sent with the series' provider ids as *episode* ids and an empty id
    set for the show, which made Simkl fail to identify episodes (`id_err`).
  - Fix a non-numeric provider id aborting a scrobble with a FormatException.
  - Fix ObjectDisposedException from disposing a session's semaphore while a concurrent
    playback event still held it.
  - Send /scrobble/stop whenever a scrobble is open so the "now watching" entry no longer
    lingers, and re-affirm active scrobbles periodically so they do not expire.
  - Retry the final /scrobble/stop call, and give up on an item after repeated failures
    instead of retrying it on every progress event.
  - Fall back to the movie title when OriginalTitle is empty.

  ### Removed ###
  - Remove the unused LegacyPlaybackScrobbler type.
